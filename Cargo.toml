[package]
name = "relix"
version = "0.1.2"
edition = "2024"

[dependencies]

gpui-kit = { version = "=0.7.1", features = ["tree-sitter-sql"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "=1.9.1"
csv = "=1.4.0"
rusqlite = { version = "=0.37.0", features = ["bundled", "hooks", "column_decltype"] }
duckdb = { version = "=1.10506.0", features = ["bundled"] }
tokio-postgres = "=0.7.18"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }
futures-util = "0.3"
postgres-native-tls = "=0.5.3"
native-tls = "=0.2.18"
mysql = { version = "=28.0.3", default-features = false, features = ["minimal-rust", "native-tls"] }
sqlparser = { version = "=0.63.0", default-features = false, features = ["std"] }
sqlformat = "=0.5.0"
anyhow = "1"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "native-tls-no-alpn"] }
sha2 = "=0.10.9"
semver = "=1.0.28"
tempfile = "=3.27.0"
zip = { version = "=6.0.0", default-features = false, features = ["deflate"] }
tar = "=0.4.46"
flate2 = "=1.1.10"
lsp-types = { version = "=0.97.0", features = ["proposed"] }


# Workaround for breaking change
# https://github.com/Lokathor/tinyvec/issues/225
tinyvec = "=1.12.0"

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
gpui-kit = { version = "=0.7.1", features = ["test-support"] }

